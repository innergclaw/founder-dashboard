name: Refresh and Brief Founder Dashboard

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      brief_mode:
        description: Briefing mode for a manual cloud test
        required: false
        default: auto
        type: choice
        options:
          - auto
          - test

permissions:
  contents: read

concurrency:
  group: founder-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh verified project signals
        env:
          SYNC_URL: https://zkyhhoxcrjkhywblzehr.supabase.co/functions/v1/founder-dashboard-sync
          SUPABASE_ANON_JWT: ${{ secrets.SUPABASE_ANON_JWT }}
        run: |
          test -n "$SUPABASE_ANON_JWT"
          curl --fail-with-body --silent --show-error \
            --request POST "$SYNC_URL" \
            --header "Authorization: Bearer $SUPABASE_ANON_JWT" \
            --header "Content-Type: application/json" \
            --data '{"source":"github-actions"}'
      - name: Prepare alerts and deliver due briefings
        env:
          BRIEF_URL: https://zkyhhoxcrjkhywblzehr.supabase.co/functions/v1/founder-daily-brief
          SUPABASE_ANON_JWT: ${{ secrets.SUPABASE_ANON_JWT }}
          BRIEF_MODE: ${{ inputs.brief_mode || 'auto' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$SUPABASE_ANON_JWT"
          BRIEF_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST "$BRIEF_URL" \
            --header "Authorization: Bearer $SUPABASE_ANON_JWT" \
            --header "Content-Type: application/json" \
            --data "{\"mode\":\"$BRIEF_MODE\",\"deliver\":false}")
          echo "$BRIEF_RESPONSE" | jq --exit-status '.ok == true' >/dev/null
          if [ "$(echo "$BRIEF_RESPONSE" | jq --raw-output '.telegram_due')" = "true" ]; then
            test -n "$TELEGRAM_BOT_TOKEN"
            test -n "$TELEGRAM_CHAT_ID"
            echo "$BRIEF_RESPONSE" | jq --raw-output '.message' | curl --fail-with-body --silent --show-error \
              --request POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode text@- \
              --data-urlencode "disable_web_page_preview=true" >/dev/null
