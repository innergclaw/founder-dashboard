name: Refresh and Brief Founder Dashboard

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      brief_mode:
        description: Briefing mode for a manual cloud test
        required: false
        default: auto
        type: choice
        options:
          - auto
          - test

permissions:
  contents: read

concurrency:
  group: founder-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh verified project signals
        env:
          SYNC_URL: https://zkyhhoxcrjkhywblzehr.supabase.co/functions/v1/founder-dashboard-sync
          SUPABASE_ANON_JWT: ${{ secrets.SUPABASE_ANON_JWT }}
        run: |
          test -n "$SUPABASE_ANON_JWT"
          curl --fail-with-body --silent --show-error \
            --request POST "$SYNC_URL" \
            --header "Authorization: Bearer $SUPABASE_ANON_JWT" \
            --header "Content-Type: application/json" \
            --data '{"source":"github-actions"}'
      - name: Prepare alerts and deliver due briefings
        env:
          BRIEF_URL: https://zkyhhoxcrjkhywblzehr.supabase.co/functions/v1/founder-daily-brief
          SUPABASE_ANON_JWT: ${{ secrets.SUPABASE_ANON_JWT }}
          BRIEF_MODE: ${{ inputs.brief_mode || 'auto' }}
        run: |
          test -n "$SUPABASE_ANON_JWT"
          curl --fail-with-body --silent --show-error \
            --request POST "$BRIEF_URL" \
            --header "Authorization: Bearer $SUPABASE_ANON_JWT" \
            --header "Content-Type: application/json" \
            --data "{\"mode\":\"$BRIEF_MODE\"}"
